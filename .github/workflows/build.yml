name: Build Zero APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK manually
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Prepare Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > zero-release.jks
            echo "✅ Keystore загружен из секрета"
          else
            keytool -genkey -v -keystore zero-release.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias zero-key \
              -storepass zeropassword \
              -keypass zeropassword \
              -dname "CN=Zero, OU=Zero, O=Zero, C=RU"
            base64 -w 0 zero-release.jks > keystore.base64.txt
            echo "⚠️ Создан новый keystore — сохрани его!"
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zero-browser-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload keystore (только если создан впервые)
        if: hashFiles('keystore.base64.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: zero-keystore-ВАЖНО
          path: |
            zero-release.jks
            keystore.base64.txt
