<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(0deg, #08080c, #0b0b11);
  color: #f5f5f7;
  user-select: none;
  border-top: 1px solid rgba(255,255,255,.08);
}
.bottombar {
  display: flex; align-items: center; justify-content: space-around;
  padding: 4px 8px; height: 100%;
}
.nav-btn {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 14px; border: none; border-radius: 14px; background: transparent;
  color: #8b8b96; font-size: 9.5px; font-weight: 700;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), color .3s;
  font-family: inherit;
}
.nav-btn svg { width: 22px; height: 22px; transition: filter .3s; }
.nav-btn:active { transform: scale(.85); }
.nav-btn.active { color: #f5f5f7; }
.nav-btn.active svg { filter: drop-shadow(0 0 8px rgba(124,58,237,.9)); }
</style>
</head>
<body>
<div class="bottombar">
  <button class="nav-btn active" id="navHome">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10l9-7 9 7v10a2 2 0 01-2 2h-4v-6H9v6H5a2 2 0 01-2-2z"/>
    </svg>
    <span>Главная</span>
  </button>
  <button class="nav-btn" id="navTabs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="4"/>
      <path d="M3 9h18"/>
    </svg>
    <span>Вкладки</span>
  </button>
  <button class="nav-btn" id="navBookmarks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    </svg>
    <span>Закладки</span>
  </button>
  <button class="nav-btn" id="navMore">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 21v-6M4 11V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 15h4M10 8h4M18 16h4"/>
    </svg>
    <span>Ещё</span>
  </button>
</div>
<script>
document.getElementById('navHome').addEventListener('click', () => { if (window.ZeroBottom) window.ZeroBottom.goHome(); });
document.getElementById('navTabs').addEventListener('click', () => { if (window.ZeroBottom) window.ZeroBottom.showTabs(); });
document.getElementById('navBookmarks').addEventListener('click', () => { if (window.ZeroBottom) window.ZeroBottom.showBookmarks(); });
document.getElementById('navMore').addEventListener('click', () => { if (window.ZeroBottom) window.ZeroBottom.showMenu(); });
</script>
</body>
</html>
