plugins { id 'com.android.application' }

android {
    namespace 'com.zero.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.zero.browser"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../zero-release.jks")
            storePassword "zeropassword"
            keyAlias "zero-key"
            keyPassword "zeropassword"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
